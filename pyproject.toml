[project]
name = "agent-sec"
version = "0.1.0"
description = "Sandboxed testbed for LLM agent security against tool poisoning and social engineering."
readme = "README.md"
authors = [
    { name = "jainrishi2001", email = "jainrishi2001@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.2",
    "fastmcp>=4.2.1",
    "google-auth>=2.62.2",
    "google-cloud-aiplatform>=2.10.0",
    "litellm>=1.110.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "tenacity>=9.1.4",
    "tqdm>=4.70.1",
    "typer>=0.29.1",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
